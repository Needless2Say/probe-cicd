# Scratch probe, a reusable workflow's jobs, called with `secrets: inherit`. Generic code, no value of its own.
#
# g1  names the caller's `dev` environment and waits in the caller's run group, then reads G1_SECRET at its start and
#     says which scratch value it holds by a label, the first or the second, never the value, which GitHub masks.
# g3  takes a group of its own run, sleeps three minutes and prints its start and end, so two runs started together
#     show whether the caller's group still holds while this job runs.

name: Probe, the reusable's jobs

on:
  workflow_call:
    inputs:
      case:
        description: g1 or g3
        required: true
        type: string

permissions:
  contents: read

jobs:
  g1:
    name: G1, the secret read at this job's start after a wait
    if: inputs.case == 'g1'
    runs-on: ubuntu-slim
    environment: dev
    concurrency:
      group: g1-wait-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Which scratch value the secret holds now
        env:
          G1_SECRET: ${{ secrets.G1_SECRET }}
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          held="$(printf '%s' "$G1_SECRET" | sha256sum | cut -d' ' -f1)"
          one="$(printf '%s' 'g1-one' | sha256sum | cut -d' ' -f1)"
          two="$(printf '%s' 'g1-two' | sha256sum | cut -d' ' -f1)"
          # a label and never the value, which GitHub masks wherever it appears, and drops from any output holding it
          if [ "$held" = "$one" ]; then word=first; elif [ "$held" = "$two" ]; then word=second; else word=neither; fi
          echo "- the reusable's job started at $now and reads G1_SECRET as the $word value"

  g3:
    name: G3, a reusable job in a group of its own
    if: inputs.case == 'g3'
    runs-on: ubuntu-slim
    # a group of this run alone, so two runs never wait on each other here, and any wait is the caller's group's
    concurrency:
      group: g3-callee-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Three minutes in its own group
        run: |
          echo "- run ${GITHUB_RUN_ID}, the reusable's job started at $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          sleep 180
          echo "- run ${GITHUB_RUN_ID}, the reusable's job ended at $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
